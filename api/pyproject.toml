[project]
name = "weight-coach"
version = "0.1.0"
description = "Personal AI-assisted weight and habit tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "truststore>=0.9",
    "tuya-connector-python>=0.1.2",
    "discord.py>=2.4",
    "apscheduler>=3.10",
    "pywebpush>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
